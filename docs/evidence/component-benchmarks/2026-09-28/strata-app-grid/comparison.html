<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StrataAppGrid reference comparison</title>
    <style>
      :root { color-scheme: light; font: 14px/1.4 "Inter", "Segoe UI", sans-serif; color: #202938; background: #f3f5f8; }
      body { margin: 0; padding: 24px; }
      main { max-width: 1552px; margin: 0 auto; }
      h1 { margin: 0 0 16px; font-size: 20px; font-weight: 650; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      figure { margin: 0; padding: 12px; background: white; border: 1px solid #d7dde6; border-radius: 8px; }
      figcaption { margin-bottom: 8px; font-weight: 600; }
      img { display: block; width: 100%; height: auto; border: 1px solid #e3e6eb; }
      @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>StrataAppGrid · matched 1000 × 605 CSS px source captures</h1>
      <div class="pair">
        <figure>
          <figcaption>Salesforce App Launcher — official help image</figcaption>
          <img src="reference-salesforce-1000x605.png" alt="Salesforce app launcher with search, a three-column app grid, and All Items list" />
        </figure>
        <figure>
          <figcaption>UniERP StrataAppGrid — Storybook default</figcaption>
          <img src="storybook-default-1000x605.png" alt="Strata app grid with six app links in three columns and two rows" />
        </figure>
      </div>
    </main>
  </body>
</html>
